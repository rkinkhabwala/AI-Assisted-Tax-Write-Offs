[project]
name = "writeoff"
version = "0.1.0"
description = "WriteOff Assistant: a grounded tax-deduction assistant for U.S. small businesses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.159",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "selectolax>=0.3",
    "anthropic>=1.8",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.13",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writeoff"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "ASYNC", "S", "PL"]
ignore = [
    "PLR0913",  # interfaces for search/calculators legitimately take many parameters
    "PLR2004",  # magic-value comparisons are fine in tests and validators
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "PLR2004", "N817"]  # Decimal as D in calculator tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["writeoff", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "db: requires the docker-compose Postgres (run `make db-up`)",
]
