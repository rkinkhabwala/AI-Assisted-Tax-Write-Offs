    value: 7060
    source_url: https://www.irs.gov/publications/p463
    evidence: "Pub 463 (2025), ch. 4, Car Expenses, Actual Car Expenses, Depreciation Limits"
  standard_mileage_rate_business:
    description: "Standard mileage rate for business use of a vehicle"
