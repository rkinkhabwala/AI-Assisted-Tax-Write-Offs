services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: writeoff
      POSTGRES_PASSWORD: writeoff
      POSTGRES_DB: writeoff
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writeoff -d writeoff"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://writeoff:writeoff@db:5432/writeoff
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command:
      - streamlit
      - run
      - src/writeoff/ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    env_file:
      - path: .env
        required: false
    environment:
      WRITEOFF_API_URL: http://app:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
